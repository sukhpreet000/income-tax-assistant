
<div class="main-wrapper">
  
  <main class="content-body">
    <!-- Page Header -->
    <div class="page-header">
      <div>
        <h2 class="page-title">Tax Document Checklist</h2>
        <p class="page-subtitle">Track and organize critical certificates, salary statements, and proof documents required before filing your Income Tax Return.</p>
      </div>
      <div class="page-actions">
        <button type="button" class="btn btn-secondary btn-sm" onclick="seedDefaultChecklist()">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
          Reset Standard Documents
        </button>
        <button type="button" class="btn btn-primary btn-sm" onclick="openAddCustomDocModal()">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          + Add Custom Document
        </button>
      </div>
    </div>

    <!-- Readiness Progress Card -->
    <div class="card" style="margin-bottom: 2rem; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); color: white;">
      <div class="card-body">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; flex-wrap: wrap; gap: 0.5rem;">
          <div>
            <div style="font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em;">Overall Filing Readiness</div>
            <div style="font-size: 1.5rem; font-weight: 800; color: #ffffff;" id="checklist-progress-text">0 of 0 Documents Ready (0%)</div>
          </div>
          <span class="badge" style="background: rgba(37, 99, 235, 0.4); color: #93c5fd; font-size: 0.85rem; padding: 0.4rem 0.8rem;">
            ITR Pre-Verification Phase
          </span>
        </div>
        <div class="progress-bar-container" style="height: 12px; background-color: #334155;">
          <div class="progress-bar-fill" id="checklist-progress-bar" style="width: 0%; background: linear-gradient(90deg, #38bdf8, #10b981);"></div>
        </div>
      </div>
    </div>

    <!-- Document Checklist Container -->
    <div style="display: flex; flex-direction: column; gap: 0.75rem;" id="checklist-items-container">
      <!-- Populated via JS -->
    </div>
  </main>

  <!-- Add Custom Document Modal -->
  <div class="modal-overlay" id="custom-doc-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title">Add Custom Document to Checklist</h3>
        <button type="button" class="modal-close" data-dismiss="modal">&times;</button>
      </div>
      <form id="custom-doc-form" onsubmit="handleAddCustomDoc(event)">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="custom-doc-name">Document Title <span class="required">*</span></label>
            <input type="text" id="custom-doc-name" class="form-control" placeholder="e.g. Electric Vehicle Loan Certificate (Sec 80EEB)" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="custom-doc-notes">Purpose / Instructions</label>
            <textarea id="custom-doc-notes" class="form-control" rows="3" placeholder="Notes on where to obtain this certificate or policy details"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Add to Checklist</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Note Edit Modal -->
  <div class="modal-overlay" id="doc-note-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" id="doc-note-title">Document Note</h3>
        <button type="button" class="modal-close" data-dismiss="modal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" for="doc-note-text">Notes / Reference No. / Policy Number</label>
          <textarea id="doc-note-text" class="form-control" rows="4"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="saveDocNote()">Save Note</button>
      </div>
    </div>
  </div>

<script src="assets/js/checklist.js"></script>
